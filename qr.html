<style>
  :root {
    --bg: #0f1512; --panel: #18211d; --ink: #e8e4d8;
    --dim: #9aa79f; --faint: #6b7a72; --amber: #d9a441;
    --amber-soft: #8a6d2f; --line: #2a3833;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px calc(32px + env(safe-area-inset-bottom));
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { margin-bottom: 22px; }
  .brand { font-size: 12px; letter-spacing: 0.28em; color: var(--amber-soft); text-transform: uppercase; }
  h1 { margin: 6px 0 8px; font-size: 22px; letter-spacing: 0.05em; color: var(--amber); }
  .lede { margin: 0; font-size: 13px; color: var(--dim); }
  .game {
    display: flex; gap: 16px; align-items: center;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px; margin-bottom: 14px;
  }
  .game.primary { border-left: 3px solid var(--amber); }
  .game-info { flex: 1; min-width: 0; }
  .game-title { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 5px; }
  .game-desc { font-size: 12px; color: var(--dim); margin-bottom: 10px; }
  .game-link { font-size: 12.5px; color: var(--amber); text-decoration: none; border-bottom: 1px solid var(--amber-soft); }
  .game-link:hover { color: var(--ink); }
  .game-qr { flex-shrink: 0; text-align: center; }
  .game-qr img {
    display: block; width: 168px; height: 168px;
    /* 二维码必须有浅色底，深色主题下直接贴会扫不出来 */
    background: #fff; padding: 8px; border-radius: 6px;
    image-rendering: pixelated;
  }
  .qr-hint { margin-top: 6px; font-size: 11px; color: var(--faint); }
  footer {
    margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--faint); line-height: 1.8;
  }
  footer code { color: var(--dim); }

  /* 手机上二维码左右并排会挤，改成上下 */
  @media (max-width: 430px) {
    .game { flex-direction: column; align-items: stretch; }
    .game-qr { align-self: center; margin-top: 4px; }
    .game-qr img { width: 190px; height: 190px; }
  }
</style>
</head>
