<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>麦芽与酒花 · 精酿啤酒厂</title>
  <style>
:root {
  --bg: #14110e;
  --panel: #1e1a16;
  --panel-2: #282218;
  --line: #3a3128;
  --ink: #ece4d8;
  --ink-dim: #a89a86;
  --ink-faint: #6e6355;
  --amber: #d99a3f;
  --amber-soft: #8a6428;
  --good: #6fae5a;
  --warn: #d9a53f;
  --bad: #c4623f;
  --radius: 10px;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button { touch-action: manipulation; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  overscroll-behavior-y: none;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(217,154,63,0.10), transparent 60%);
}

#app {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 16px calc(28px + env(safe-area-inset-bottom));
}

/* ── 顶栏 ─────────────────────────────────────── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
  margin: 0 -16px;
  background: linear-gradient(to bottom, var(--bg) 72%, transparent);
  backdrop-filter: blur(6px);
}

.brand {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--amber);
  flex: 1;
}

.stat {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  line-height: 1.2;
}
.stat .k { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.1em; }
.stat .v { font-family: var(--mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ── 卡片 ─────────────────────────────────────── */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}

.card-title {
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin-bottom: 10px;
}

/* ── 配方编辑 ─────────────────────────────────── */
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 0;
}

.row + .row { border-top: 1px solid rgba(58,49,40,0.5); }

.row label {
  flex: 1;
  font-size: 14px;
  color: var(--ink);
}

.row .hint {
  font-size: 11px;
  color: var(--ink-faint);
}

input[type="range"] {
  flex: 1.1;
  -webkit-appearance: none;
  appearance: none;
  height: 3px;
  background: var(--line);
  border-radius: 2px;
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--amber);
  cursor: pointer;
  border: 2px solid var(--bg);
  box-shadow: 0 0 0 1px var(--amber-soft);
}

input[type="range"]::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--amber); cursor: pointer; border: 2px solid var(--bg);
}

select {
  background: var(--panel-2);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 13px;
  font-family: inherit;
  outline: none;
}

.num {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  color: var(--amber);
  min-width: 52px;
  text-align: right;
}

/* ── 实时预测 ─────────────────────────────────── */
.predict {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--line);
  border-radius: 8px;
  overflow: hidden;
  margin-top: 10px;
}

.predict > div {
  background: var(--panel);
  padding: 8px 6px;
  text-align: center;
}

.predict .k { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.06em; }
.predict .v { font-family: var(--mono); font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
.predict .v.out { color: var(--bad); }

/* ── 按钮 ─────────────────────────────────────── */
button {
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  border: none;
  border-radius: 8px;
  padding: 12px 16px;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  letter-spacing: 0.04em;
}

button:active:not(:disabled) { transform: scale(0.985); }
button:disabled { opacity: 0.38; cursor: not-allowed; }

.btn-primary { background: var(--amber); color: #1a1408; width: 100%; }
.btn-ghost {
  background: transparent; color: var(--ink-dim);
  border: 1px solid var(--line); font-weight: 500;
}
.btn-good { background: var(--good); color: #0e1a0a; }
.btn-sm { padding: 8px 12px; font-size: 13px; }

/* ── 批次卡片 ─────────────────────────────────── */
.batch {
  background: var(--panel);
  border: 1px solid var(--line);
  border-left: 3px solid var(--amber);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 10px;
}
.batch.done { border-left-color: var(--good); }

.batch-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 4px;
}
.batch-name { font-weight: 600; font-size: 14px; }
.batch-style { font-size: 11px; color: var(--ink-faint); }

.progress {
  height: 3px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
  margin: 8px 0 6px;
}
.progress > i {
  display: block;
  height: 100%;
  background: var(--amber);
  transition: width 0.4s ease;
}
.batch.done .progress > i { background: var(--good); }

.batch-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--ink-faint);
  font-family: var(--mono);
}

/* ── 评分卡 ───────────────────────────────────── */
.score-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 10px;
}
.score-total {
  font-family: var(--mono);
  font-size: 30px;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.score-grade { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
.g-Outstanding { color: var(--amber); }
.g-Excellent { color: var(--good); }
.g-Very { color: #9cae6a; }
.g-Good { color: var(--warn); }
.g-Fair, .g-Problematic { color: var(--bad); }

.metric { margin-bottom: 7px; }
.metric-head {
  display: flex; justify-content: space-between;
  font-size: 12px; margin-bottom: 3px;
}
.metric-head .n { color: var(--ink-dim); }
.metric-head .s { font-family: var(--mono); color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.metric-bar {
  height: 4px; background: var(--line); border-radius: 2px; overflow: hidden;
}
.metric-bar > i { display: block; height: 100%; background: var(--amber); border-radius: 2px; }

.reasons {
  margin: 8px 0 0;
  padding: 9px 11px;
  background: rgba(196,98,63,0.08);
  border-left: 2px solid rgba(196,98,63,0.5);
  border-radius: 0 6px 6px 0;
  font-size: 12.5px;
  color: var(--ink-dim);
  line-height: 1.65;
}
.reasons.pos { background: rgba(111,174,90,0.08); border-left-color: rgba(111,174,90,0.5); }

.summary {
  font-size: 13px;
  color: var(--ink-dim);
  line-height: 1.7;
  margin: 10px 0 0;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}

/* ── 空态 / 提示 ──────────────────────────────── */
.empty {
  text-align: center;
  padding: 26px 16px;
  color: var(--ink-faint);
  font-size: 13px;
  line-height: 1.8;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(80px);
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 13px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.5);
  opacity: 0;
  transition: transform 0.28s cubic-bezier(.2,.9,.3,1.1), opacity 0.28s;
  pointer-events: none;
  max-width: calc(100vw - 48px);
  z-index: 100;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

.section-gap { height: 6px; }

.footer-note {
  text-align: center;
  font-size: 11px;
  color: var(--ink-faint);
  padding: 18px 0 4px;
  line-height: 1.8;
}

/* ══════════════════════════════════════════════════
   经营面板（v2）
   ══════════════════════════════════════════════════ */

/* ── 阶段条 ───────────────────────────────────── */
.stage-bar {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 11px 14px;
  margin-bottom: 12px;
}
.stage-bar .stage-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--amber);
  letter-spacing: 0.04em;
}
.stage-bar .stage-next {
  float: right;
  font-size: 11px;
  color: var(--ink-faint);
  font-family: var(--mono);
}
.stage-bar .progress { margin: 9px 0 7px; }
.stage-bar .stage-req {
  font-size: 11px;
  color: var(--ink-faint);
  line-height: 1.6;
  font-family: var(--mono);
}

/* ── 事件卡 ───────────────────────────────────── */
.event-card {
  border-color: rgba(217,154,63,0.45);
  background: linear-gradient(160deg, rgba(217,154,63,0.10), transparent 70%), var(--panel);
  animation: eventIn 0.4s ease;
}
@keyframes eventIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: none; }
}
.event-tag {
  display: inline-block;
  font-size: 10px;
  letter-spacing: 0.16em;
  color: var(--amber);
  border: 1px solid rgba(217,154,63,0.4);
  border-radius: 3px;
  padding: 2px 7px;
  margin-bottom: 9px;
}
.event-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.event-desc { font-size: 13px; color: var(--ink-dim); line-height: 1.7; margin-bottom: 12px; }
.event-choices { display: flex; flex-direction: column; gap: 8px; }

.choice {
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-align: left;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 13px;
  color: var(--ink);
  font-weight: 500;
}
.choice:hover:not(:disabled) { border-color: var(--amber-soft); }
.choice .choice-label { font-size: 14px; }
.choice .choice-hint { font-size: 11.5px; color: var(--ink-faint); font-weight: 400; line-height: 1.5; }

/* ── 行动网格 ─────────────────────────────────── */
.ap-badge {
  float: right;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--amber);
  background: rgba(217,154,63,0.12);
  border-radius: 4px;
  padding: 1px 7px;
}
.ap-badge.spent { color: var(--ink-faint); background: rgba(110,99,85,0.14); }

.action-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.action {
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-align: left;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 11px 13px;
  color: var(--ink);
  font-weight: 500;
}
.action:hover:not(:disabled) { border-color: var(--amber-soft); background: #2e271c; }
.action .action-label { font-size: 14px; }
.action .action-sub { font-size: 11px; color: var(--ink-faint); font-weight: 400; }

.ap-note {
  margin-top: 10px;
  font-size: 12px;
  color: var(--ink-faint);
  text-align: center;
}

/* ── 选择列表（研发/生产/招聘） ────────────────── */
.pick-list { display: flex; flex-direction: column; gap: 7px; }
.pick {
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-align: left;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 13px;
  color: var(--ink);
  font-weight: 500;
}
.pick:hover:not(:disabled) { border-color: var(--amber-soft); }
.pick .pick-name { font-size: 14px; }
.pick .pick-name em { font-style: normal; color: var(--amber); font-family: var(--mono); font-size: 12px; }
.pick .pick-meta { font-size: 11.5px; color: var(--ink-faint); font-weight: 400; }
.pick .pick-cost { font-size: 11.5px; color: var(--ink-faint); font-family: var(--mono); font-weight: 400; }
.cancel { margin-top: 9px; width: 100%; }

/* ── 经营数据格 ───────────────────────────────── */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.stat-cell {
  background: var(--panel);
  padding: 9px 4px;
  text-align: center;
}
.stat-cell .sc-k { display: block; font-size: 10px; color: var(--ink-faint); letter-spacing: 0.06em; }
.stat-cell .sc-v {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.stat-cell .sc-v em { font-style: normal; font-size: 10px; color: var(--ink-faint); margin-left: 1px; }
.stat-cell.good .sc-v { color: var(--good); }
.stat-cell.warn .sc-v { color: var(--warn); }
.stat-cell.bad .sc-v { color: var(--bad); }

.cost-row {
  margin-top: 9px;
  font-size: 11.5px;
  color: var(--ink-faint);
  font-family: var(--mono);
}

.gap-note {
  margin-top: 9px;
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 11.5px;
  line-height: 1.6;
}
.gap-note.bad {
  color: #e08a72;
  background: rgba(196, 98, 63, 0.12);
  border-left: 2px solid rgba(196, 98, 63, 0.6);
}
.gap-note.warn {
  color: #d9b862;
  background: rgba(217, 165, 63, 0.10);
  border-left: 2px solid rgba(217, 165, 63, 0.55);
}

/* ── 发酵罐 ───────────────────────────────────── */
.tank-list { display: flex; flex-direction: column; gap: 1px; }
.tank-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  padding: 8px 10px;
  background: var(--panel-2);
  border-left: 2px solid var(--line);
  font-size: 13px;
}
.tank-row.brewing { border-left-color: var(--amber); }
.tank-row.contract { border-left-color: var(--warn); }
.tank-row .tank-name { font-weight: 600; color: var(--ink); }
.tank-row .tank-status { font-size: 11.5px; color: var(--ink-faint); font-family: var(--mono); }
.tank-row.empty-tank .tank-status { color: var(--ink-faint); }

/* ── 库存 ─────────────────────────────────────── */
.inv-list { display: flex; flex-direction: column; gap: 1px; }
.inv-row {
  display: flex;
  justify-content: space-between;
  padding: 7px 10px;
  background: var(--panel-2);
  font-size: 13px;
}
.inv-row .inv-meta { font-size: 11.5px; color: var(--ink-faint); font-family: var(--mono); }
.inv-row.warn .inv-meta { color: var(--warn); }
.inv-row.bad .inv-meta { color: var(--bad); }

/* ── 员工 ─────────────────────────────────────── */
.staff-list { display: flex; flex-direction: column; gap: 1px; }
.staff-row {
  display: grid;
  grid-template-columns: 1.2fr 0.9fr 0.7fr 0.6fr 0.6fr;
  gap: 6px;
  align-items: baseline;
  padding: 8px 10px;
  background: var(--panel-2);
  font-size: 12px;
}
.staff-row .staff-name { font-weight: 600; font-size: 13px; }
.staff-row .staff-role { color: var(--ink-dim); }
.staff-row .staff-skill { font-family: var(--mono); color: var(--ink); text-align: right; }
.staff-row .staff-skill.drag { color: var(--warn); }
.staff-row .staff-mood { font-family: var(--mono); color: var(--ink-faint); font-size: 11.5px; text-align: right; }
.staff-row .staff-mood.bad { color: var(--bad); }

/* ── 配方（可展开） ─────────────────────────── */
.recipe-list { display: flex; flex-direction: column; gap: 6px; }

.recipe-card {
  background: var(--panel-2);
  border-left: 2px solid var(--line);
  border-radius: 0 8px 8px 0;
  overflow: hidden;
}
.recipe-card.good { border-left-color: var(--good); }
.recipe-card.bad { border-left-color: var(--bad); }
.recipe-card.open { background: #2b2419; }

.recipe-head {
  display: grid;
  grid-template-columns: 1.4fr 0.45fr 1.9fr 0.25fr;
  gap: 7px;
  align-items: baseline;
  width: 100%;
  padding: 9px 11px;
  background: transparent;
  border: none;
  border-radius: 0;
  color: var(--ink);
  text-align: left;
  font-weight: 500;
}
.recipe-head:hover { background: rgba(217,154,63,0.05); }
.recipe-head .recipe-name { font-size: 13.5px; }
.recipe-head .recipe-name .flag {
  font-style: normal;
  font-size: 9.5px;
  color: var(--amber);
  border: 1px solid var(--amber-soft);
  border-radius: 3px;
  padding: 0 3px;
  margin-left: 4px;
  vertical-align: 1px;
}
.recipe-head .recipe-score {
  font-family: var(--mono);
  font-weight: 600;
  color: var(--amber);
  font-size: 14px;
}
.recipe-head .recipe-meta {
  font-size: 10.5px;
  color: var(--ink-faint);
  font-family: var(--mono);
}
.recipe-head .recipe-caret { color: var(--ink-faint); font-size: 10px; text-align: right; }

.recipe-body {
  padding: 2px 11px 12px;
  border-top: 1px solid rgba(58,49,40,0.6);
  margin-top: 2px;
}
.recipe-sub {
  font-size: 11px;
  color: var(--ink-faint);
  padding: 8px 0 10px;
}
.recipe-dims { margin-bottom: 10px; }

.metric { margin-bottom: 8px; }
.metric-head {
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
  margin-bottom: 3px;
}
.metric-head .n { color: var(--ink-dim); }
.metric-head .s { font-family: var(--mono); color: var(--ink-faint); }
.metric-bar {
  height: 3px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.metric-bar > i {
  display: block;
  height: 100%;
  background: var(--amber);
  border-radius: 2px;
}
.metric-why {
  font-size: 10.5px;
  color: var(--ink-faint);
  line-height: 1.55;
  margin-top: 4px;
  padding-left: 6px;
  border-left: 1px solid rgba(58,49,40,0.8);
}

.recipe-fit { padding-top: 8px; border-top: 1px solid rgba(58,49,40,0.6); }
.fit-row {
  font-size: 11px;
  color: var(--ink-faint);
  line-height: 1.7;
  font-family: var(--mono);
}
.fit-row .fit-k {
  display: inline-block;
  min-width: 34px;
  color: var(--ink-dim);
  font-family: inherit;
}

.recipe-actions {
  display: flex;
  gap: 7px;
  margin-top: 10px;
}
.recipe-actions button { flex: 1; }

/* ── 对手 ─────────────────────────────────── */
.rival-row {
  display: flex;
  justify-content: space-between;
  margin-top: 9px;
  padding-top: 9px;
  border-top: 1px solid rgba(58,49,40,0.6);
  font-size: 12px;
}
.rival-row .rival-name { color: var(--ink-dim); }
.rival-row .rival-share { font-family: var(--mono); color: var(--bad); }
.rival-move {
  font-size: 10.5px;
  color: var(--ink-faint);
  margin-top: 3px;
}

/* ── 经验条 ───────────────────────────────── */
.exp-bar {
  height: 3px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
  align-self: center;
}
.exp-bar > i { display: block; height: 100%; background: var(--good); border-radius: 2px; }

/* ── 结束本月 ─────────────────────────────────── */
.end-card { padding: 12px 14px 10px; }
.end-hint {
  margin-top: 9px;
  font-size: 11.5px;
  color: var(--ink-faint);
  text-align: center;
  line-height: 1.6;
}

/* ── 日志 ─────────────────────────────────────── */
.log-list { display: flex; flex-direction: column; gap: 5px; }
.log-row {
  font-size: 12px;
  color: var(--ink-dim);
  line-height: 1.55;
  padding-left: 9px;
  border-left: 2px solid var(--line);
}
.log-row.good { border-left-color: rgba(111,174,90,0.6); }
.log-row.bad { border-left-color: rgba(196,98,63,0.6); }
.log-row .log-month {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-faint);
  margin-right: 7px;
}

/* ── 结局 ─────────────────────────────────────── */
.ending { text-align: center; padding: 36px 22px; margin-top: 40px; }
.ending-title { font-size: 22px; font-weight: 700; color: var(--amber); margin-bottom: 14px; letter-spacing: 0.06em; }
.ending-desc { font-size: 13.5px; color: var(--ink-dim); line-height: 1.85; margin-bottom: 24px; }

/* ── 移动端 ───────────────────────────────────── */
@media (max-width: 400px) {
  .action-grid { grid-template-columns: 1fr; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .staff-row { grid-template-columns: 1.1fr 0.9fr 0.7fr 0.6fr 0.6fr; }
  .recipe-row { grid-template-columns: 1.2fr 0.5fr 1.6fr; }
}

.pick-cost.slow { color: var(--warn); }
