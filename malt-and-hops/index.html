<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1512" />
  <title>麦芽与酒花 · 精酿啤酒厂</title>
  <style>
:root {
  /* 酒厂绿 + 奶油 + 铜：深绿背景，橡木桶与铜器的暖色点缀 */
  --bg: #0f1512;
  --bg-deep: #0b100d;
  --panel: #18211c;
  --panel-2: #22302a;
  --panel-3: #26342c;
  --line: #34473d;
  --line-soft: rgba(52, 71, 61, 0.55);
  --ink: #f0ead9;
  --ink-dim: #b3bcaa;
  --ink-faint: #7a8776;
  --amber: #d7a24a;
  --amber-soft: #8f6a2f;
  --amber-ink: var(--amber-ink);
  --good: #84b56a;
  --good-ink: var(--good-ink);
  --warn: #d7a24a;
  --warn-soft: #d9c37a;
  --bad: #cf6a4a;
  --bad-soft: #e59a7e;
  --very-good: #a8c77a;
  --shadow: rgba(0, 0, 0, 0.5);
  --radius: 10px;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button { touch-action: manipulation; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  overscroll-behavior-y: none;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(215, 162, 74, 0.10), transparent 60%);
}

#app {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 16px calc(28px + env(safe-area-inset-bottom));
}

/* ── 顶栏（含分页导航，整体粘住） ───────────────── */
.app-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  /* 底部留一点渐隐，避免内容「硬切」在导航栏下缘 */
  box-shadow: 0 1px 0 var(--line-soft), 0 8px 16px -12px var(--shadow);
}

/* ── 顶栏 ─────────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
  margin: 0 -16px;
}

.brand {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--amber);
  flex: 1;
}

.stat {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  line-height: 1.2;
}
.stat .k { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.1em; }
.stat .v { font-family: var(--mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ── 卡片 ─────────────────────────────────────── */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}

.card-title {
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin-bottom: 10px;
}

/* ── 折叠卡片（v0.22）───────────────────────────────────────────────
 *
 * 分层的目的：一屏 900px 的手机上，每页 1400–1800px 里有大量
 * 「偶尔看一眼」的面板。收起它们，只留一行有信息量的摘要。
 *
 * 摘要行是重点 —— 它必须自己就够用（「酒厂升级 Lv.7/25 · 下一项 ¥15,000」），
 * 不能只是标题。否则收起后还得逐个点开找，比不收起更累。
 */
.fold-card {
  padding: 0;
  overflow: hidden;
}
.fold-head {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 4px 8px;
  padding: 13px 14px;
  cursor: pointer;
  list-style: none;
  /* 触控目标至少 44px 高，别让折叠行比按钮还难按 */
  min-height: 44px;
  box-sizing: border-box;
}
.fold-head::-webkit-details-marker { display: none; }
.fold-card[open] > .fold-head { border-bottom: 1px solid var(--line-soft); }
.fold-head:hover { background: rgba(215, 162, 74, 0.05); }

.fold-title {
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--ink-faint);
  text-transform: uppercase;
}
/* 收起时标题保持醒目一点：它是这一行里唯一的"这是什么" */
.fold-card:not([open]) .fold-title { color: var(--ink-dim); }

.fold-hint {
  font-size: 10.5px;
  color: var(--ink-faint);
  font-family: var(--mono);
}
.fold-summary {
  flex-basis: 100%;
  font-size: 12.5px;
  color: var(--ink-dim);
  font-family: var(--mono);
  line-height: 1.5;
}
/* 展开后摘要就重复了 —— 内容区里写着同样的东西 */
.fold-card[open] > .fold-head .fold-summary { display: none; }

.fold-head::after {
  content: '▸';
  margin-left: auto;
  color: var(--ink-faint);
  font-size: 10px;
}
.fold-card[open] > .fold-head::after { content: '▾'; }

.fold-body { padding: 0 14px 14px; }
/* 展开后内容自带标题的话会把 0 间距挤在一起，补一点 */
.fold-body > :first-child { margin-top: 12px; }

/* ── 配方编辑 ─────────────────────────────────── */
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 0;
}

.row + .row { border-top: 1px solid var(--line-soft); }

.row label {
  flex: 1;
  font-size: 14px;
  color: var(--ink);
}

.row .hint {
  font-size: 11px;
  color: var(--ink-faint);
}

input[type="range"] {
  flex: 1.1;
  -webkit-appearance: none;
  appearance: none;
  height: 3px;
  background: var(--line);
  border-radius: 2px;
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--amber);
  cursor: pointer;
  border: 2px solid var(--bg);
  box-shadow: 0 0 0 1px var(--amber-soft);
}

input[type="range"]::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--amber); cursor: pointer; border: 2px solid var(--bg);
}

select {
  background: var(--panel-2);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 13px;
  font-family: inherit;
  outline: none;
}

.num {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  color: var(--amber);
  min-width: 52px;
  text-align: right;
}

/* ── 实时预测 ─────────────────────────────────── */
.predict {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--line);
  border-radius: 8px;
  overflow: hidden;
  margin-top: 10px;
}

.predict > div {
  background: var(--panel);
  padding: 8px 6px;
  text-align: center;
}

.predict .k { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.06em; }
.predict .v { font-family: var(--mono); font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
.predict .v.out { color: var(--bad); }

/* ── 按钮 ─────────────────────────────────────── */
button {
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  border: none;
  border-radius: 8px;
  padding: 12px 16px;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  letter-spacing: 0.04em;
}

button:active:not(:disabled) { transform: scale(0.985); }
button:disabled { opacity: 0.38; cursor: not-allowed; }

.btn-primary { background: var(--amber); color: var(--amber-ink); width: 100%; }
.btn-ghost {
  background: transparent; color: var(--ink-dim);
  border: 1px solid var(--line); font-weight: 500;
}
.btn-good { background: var(--good); color: var(--good-ink); }
.btn-sm { min-height: 42px; padding: 8px 12px; font-size: 13px; }
/**
 * 强调按钮，但**不带 width: 100%**。
 *
 * .btn-primary 是给整行主按钮用的（width:100%）。一旦它出现在 flex 行里，
 * 会把同一行的文字压成宽度 0 —— 「混酿入口」那张卡就是这么塌掉的。
 */
.btn-cta {
  background: var(--amber);
  color: var(--amber-ink);
  font-weight: 600;
  white-space: nowrap;
}

/* ── 批次卡片 ─────────────────────────────────── */
.batch {
  background: var(--panel);
  border: 1px solid var(--line);
  border-left: 3px solid var(--amber);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 10px;
}
.batch.done { border-left-color: var(--good); }

.batch-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 4px;
}
.batch-name { font-weight: 600; font-size: 14px; }
.batch-style { font-size: 11px; color: var(--ink-faint); }

.progress {
  height: 3px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
  margin: 8px 0 6px;
}
.progress > i {
  display: block;
  height: 100%;
  background: var(--amber);
  transition: width 0.4s ease;
}
.batch.done .progress > i { background: var(--good); }

.batch-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--ink-faint);
  font-family: var(--mono);
}

/* ── 评分卡 ───────────────────────────────────── */
.score-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 10px;
}
.score-total {
  font-family: var(--mono);
  font-size: 30px;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.score-grade { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
.g-Outstanding { color: var(--amber); }
.g-Excellent { color: var(--good); }
.g-Very { color: var(--very-good); }
.g-Good { color: var(--warn); }
.g-Fair, .g-Problematic { color: var(--bad); }

.metric { margin-bottom: 7px; }
.metric-head {
  display: flex; justify-content: space-between;
  font-size: 12px; margin-bottom: 3px;
}
.metric-head .n { color: var(--ink-dim); }
.metric-head .s { font-family: var(--mono); color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.metric-bar {
  height: 4px; background: var(--line); border-radius: 2px; overflow: hidden;
}
.metric-bar > i { display: block; height: 100%; background: var(--amber); border-radius: 2px; }

.reasons {
  margin: 8px 0 0;
  padding: 9px 11px;
  background: rgba(207, 106, 74, 0.08);
  border-left: 2px solid rgba(207, 106, 74, 0.5);
  border-radius: 0 6px 6px 0;
  font-size: 12.5px;
  color: var(--ink-dim);
  line-height: 1.65;
}
.reasons.pos { background: rgba(132, 181, 106, 0.08); border-left-color: rgba(132, 181, 106, 0.5); }

.summary {
  font-size: 13px;
  color: var(--ink-dim);
  line-height: 1.7;
  margin: 10px 0 0;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}

/* ── 空态 / 提示 ──────────────────────────────── */
.empty {
  text-align: center;
  padding: 26px 16px;
  color: var(--ink-faint);
  font-size: 13px;
  line-height: 1.8;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(80px);
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 13px;
  box-shadow: 0 8px 28px var(--shadow);
  opacity: 0;
  transition: transform 0.28s cubic-bezier(.2,.9,.3,1.1), opacity 0.28s;
  pointer-events: none;
  max-width: calc(100vw - 48px);
  z-index: 100;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

.section-gap { height: 6px; }

.footer-note {
  text-align: center;
  font-size: 11px;
  color: var(--ink-faint);
  padding: 18px 0 4px;
  line-height: 1.8;
}

/* ══════════════════════════════════════════════════
   经营面板（v2）
   ══════════════════════════════════════════════════ */

/* ── 阶段条 ───────────────────────────────────── */
.stage-bar {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 11px 14px;
  margin-bottom: 12px;
}
.stage-bar .stage-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--amber);
  letter-spacing: 0.04em;
}
.stage-bar .stage-next {
  float: right;
  font-size: 11px;
  color: var(--ink-faint);
  font-family: var(--mono);
}
.stage-bar .progress { margin: 9px 0 7px; }
.stage-bar .stage-req {
  font-size: 11px;
  color: var(--ink-faint);
  line-height: 1.6;
  font-family: var(--mono);
}

/* ── 事件卡 ───────────────────────────────────── */
.event-card {
  border-color: rgba(215, 162, 74, 0.45);
  background: linear-gradient(160deg, rgba(215, 162, 74, 0.10), transparent 70%), var(--panel);
  animation: eventIn 0.4s ease;
}
@keyframes eventIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: none; }
}
.event-tag {
  display: inline-block;
  font-size: 10px;
  letter-spacing: 0.16em;
  color: var(--amber);
  border: 1px solid rgba(215, 162, 74, 0.4);
  border-radius: 3px;
  padding: 2px 7px;
  margin-bottom: 9px;
}
.event-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.event-desc { font-size: 13px; color: var(--ink-dim); line-height: 1.7; margin-bottom: 12px; }
.event-choices { display: flex; flex-direction: column; gap: 8px; }

.choice {
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-align: left;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 13px;
  color: var(--ink);
  font-weight: 500;
}
.choice:hover:not(:disabled) { border-color: var(--amber-soft); }
.choice .choice-label { font-size: 14px; }
.choice .choice-hint { font-size: 11.5px; color: var(--ink-faint); font-weight: 400; line-height: 1.5; }

/* ── 行动网格 ─────────────────────────────────── */
.ap-badge {
  float: right;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--amber);
  background: rgba(215, 162, 74, 0.12);
  border-radius: 4px;
  padding: 1px 7px;
}
.ap-badge.spent { color: var(--ink-faint); background: rgba(122, 135, 118, 0.14); }

.action-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.action {
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-align: left;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 11px 13px;
  color: var(--ink);
  font-weight: 500;
}
.action:hover:not(:disabled) { border-color: var(--amber-soft); background: var(--panel-3); }
.action .action-label { font-size: 14px; }
.action .action-sub { font-size: 11px; color: var(--ink-faint); font-weight: 400; }

.ap-note {
  margin-top: 10px;
  font-size: 12px;
  color: var(--ink-faint);
  text-align: center;
}

/* ── 选择列表（研发/生产/招聘） ────────────────── */
.pick-list { display: flex; flex-direction: column; gap: 7px; }
.pick {
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-align: left;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 13px;
  color: var(--ink);
  font-weight: 500;
}
.pick:hover:not(:disabled) { border-color: var(--amber-soft); }
.pick .pick-name { font-size: 14px; }
.pick .pick-name em { font-style: normal; color: var(--amber); font-family: var(--mono); font-size: 12px; }
.pick .pick-meta { font-size: 11.5px; color: var(--ink-faint); font-weight: 400; }
.pick .pick-cost { font-size: 11.5px; color: var(--ink-faint); font-family: var(--mono); font-weight: 400; }
.cancel { margin-top: 9px; width: 100%; }

/* ── 经营数据格 ───────────────────────────────── */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.stat-cell {
  background: var(--panel);
  padding: 9px 4px;
  text-align: center;
}
.stat-cell .sc-k { display: block; font-size: 10px; color: var(--ink-faint); letter-spacing: 0.06em; }
.stat-cell .sc-v {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.stat-cell .sc-v em { font-style: normal; font-size: 10px; color: var(--ink-faint); margin-left: 1px; }
.stat-cell .sc-sub {
  display: block;
  margin-top: 2px;
  padding: 0 3px;
  font-size: 9.5px;
  line-height: 1.35;
  color: var(--ink-faint);
}
.stat-cell.good .sc-v { color: var(--good); }
.stat-cell.warn .sc-v { color: var(--warn); }
.stat-cell.bad .sc-v { color: var(--bad); }
.stat-hint {
  margin-top: 7px;
  font-size: 10.5px;
  line-height: 1.6;
  color: var(--ink-faint);
}

/* ── 酒馆合同 ─────────────────────────────────── */
.contract-section {
  margin: 10px 0 5px;
  font-size: 10.5px;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
}
.contract-active,
.contract-offer {
  background: var(--panel-2);
  border-left: 2px solid var(--line);
  border-radius: 0 8px 8px 0;
  padding: 9px 10px;
  margin-bottom: 6px;
}
.contract-active.ok { border-left-color: var(--good); }
.contract-active.warn { border-left-color: var(--warn); }
.contract-offer { border-left-color: var(--amber); }
.contract-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: baseline;
  font-size: 12.5px;
}
.contract-top b { font-weight: 600; }
.contract-top span { color: var(--ink-faint); font-size: 10.5px; }
.contract-req {
  margin-top: 3px;
  font-size: 11px;
  color: var(--ink-dim);
  font-family: var(--mono);
  line-height: 1.5;
}
.contract-meta {
  margin-top: 4px;
  font-size: 10.5px;
  color: var(--ink-faint);
  line-height: 1.5;
}
.contract-meta.good { color: var(--good); }
.contract-bar {
  height: 3px;
  margin: 6px 0 4px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.contract-bar > i {
  display: block;
  height: 100%;
  background: var(--warn);
  border-radius: 2px;
}
.contract-active.ok .contract-bar > i { background: var(--good); }
.contract-offer .btn-sm { width: 100%; margin-top: 7px; }

.cost-row {
  margin-top: 9px;
  font-size: 11.5px;
  color: var(--ink-faint);
  font-family: var(--mono);
}

.gap-note {
  margin-top: 9px;
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 11.5px;
  line-height: 1.6;
}
.gap-note.bad {
  color: var(--bad-soft);
  background: rgba(207, 106, 74, 0.12);
  border-left: 2px solid rgba(207, 106, 74, 0.6);
}
.gap-note.warn {
  color: var(--warn-soft);
  background: rgba(215, 162, 74, 0.10);
  border-left: 2px solid rgba(215, 162, 74, 0.55);
}
.gap-note.info {
  color: var(--ink-dim);
  background: rgba(132, 181, 106, 0.06);
  border-left: 2px solid var(--line);
}

/* ── 季节趋势 ─────────────────────────────────── */
.trend-card { border-left: 2px solid var(--good); }
.trend-main { font-size: 16px; font-weight: 600; color: var(--amber); }
.trend-meta {
  margin-top: 2px;
  font-size: 11px;
  color: var(--ink-dim);
  line-height: 1.6;
}

/* ── 橡木桶 ───────────────────────────────────── */
.barrel-card { border-left: 2px solid var(--amber-soft); }
.barrel-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
.barrel-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 8px;
  background: var(--panel-2);
  border-radius: 6px;
  font-size: 11.5px;
  color: var(--ink-dim);
}
.barrel-row b { color: var(--ink); font-weight: 600; }
.barrel-row span { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
.barrel-row.empty { opacity: .8; }
.barrel-row.aged { border-left: 2px solid var(--amber-soft); }
.barrel-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.barrel-actions .btn-sm { min-height: 42px; }

/* 桶型商店 */
.barrel-shop { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.barrel-shop-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 9px;
  background: var(--panel-2);
  border-radius: 7px;
}
.barrel-shop-row.locked { opacity: .5; }
.barrel-shop-row .btn-sm { min-width: 78px; flex-shrink: 0; }
.barrel-shop-row .btn-sm:not(:disabled) { color: var(--amber); border-color: var(--amber-soft); }
.barrel-shop-info { flex: 1; min-width: 0; }
.barrel-shop-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
.barrel-shop-head b { color: var(--ink); font-weight: 600; font-size: 12.5px; }
.barrel-shop-head span { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
.barrel-own {
  font-size: 10px; font-style: normal;
  color: var(--amber); border: 1px solid var(--amber-soft);
  border-radius: 4px; padding: 0 4px;
}
.barrel-shop-desc { font-size: 11px; color: var(--ink-dim); line-height: 1.45; margin: 2px 0; }
.barrel-shop-meta { font-size: 10.5px; color: var(--ink-faint); }

/* ── 混酿 ─────────────────────────────────────── */
.blend-card { border-left: 2px solid var(--amber-soft); }
.blend-pick-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  background: var(--panel-2);
  border-radius: 7px;
  margin-bottom: 5px;
}
.blend-pick-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.blend-pick-info b { color: var(--ink); font-weight: 600; font-size: 12px; }
.blend-pick-info span { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); }
.blend-stepper { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.blend-stepper .btn-sm { min-width: 34px; padding: 0 6px; }
.blend-pct {
  font-family: var(--mono); font-size: 12px; color: var(--amber);
  min-width: 38px; text-align: center;
}
.blend-add { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.blend-liters {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  margin: 8px 0; padding: 7px 10px;
  background: var(--bg-sunken, rgba(127, 127, 127, 0.06));
  border-radius: 8px;
}
.blend-liters-label { font-size: 12px; color: var(--ink-faint); }
.blend-liters b { font-family: var(--mono); font-size: 13px; color: var(--ink); }
.blend-liters .stat-hint { flex-basis: 100%; margin: 0; }
.blend-estimate {
  margin-top: 8px;
  padding: 8px 9px;
  background: var(--panel-2);
  border-radius: 7px;
  font-size: 11.5px;
}
.blend-est-line { display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; }
.blend-est-line span { color: var(--ink-faint); }
.blend-est-line b { font-family: var(--mono); color: var(--ink); font-weight: 600; }
.blend-est-why { margin-top: 5px; font-size: 11px; color: var(--ink-dim); }
.blend-est-note { margin-top: 5px; font-size: 10px; color: var(--ink-faint); }
.blend-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.blend-actions .btn-sm { min-height: 42px; }
.blend-terroir {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 8px;
  padding: 8px 9px;
  background: var(--panel-2);
  border-radius: 7px;
}
.blend-terroir-group { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.blend-terroir-group .btn-sm { min-height: 32px; padding: 4px 9px; font-size: 11.5px; }
.blend-terroir-group .btn-sm.on { color: var(--amber); border-color: var(--amber-soft); background: var(--panel-3); }
.blend-est-why.bad { color: var(--warn); }

/* ── 派遣探索 ─────────────────────────────────── */
.dispatch-card { border-left: 2px solid var(--amber-soft); }
.dispatch-sites { display: flex; flex-direction: column; gap: 6px; }
.dispatch-site {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  padding: 9px 10px;
  background: var(--panel-2);
  border-left: 2px solid transparent;
  border-radius: 0 7px 7px 0;
}
.dispatch-site.active { border-left-color: var(--amber); background: var(--panel-3); }
.dispatch-site.locked { opacity: .5; }
.dispatch-site-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.dispatch-site-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px; }
.dispatch-site-head b { font-size: 12.5px; color: var(--ink); }
.dispatch-site-head span { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
.dispatch-lock { font-style: normal; font-size: 10px; color: var(--warn); }
.dispatch-site-desc { font-size: 11px; color: var(--ink-dim); line-height: 1.5; }
.dispatch-site-meta { font-size: 10.5px; color: var(--ink-faint); }
.dispatch-site .btn-sm { min-width: 76px; flex-shrink: 0; }
.dispatch-site .btn-sm:not(:disabled) { color: var(--amber); border-color: var(--amber-soft); }
.dispatch-picker {
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px solid var(--line);
}
.dispatch-pick-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 9px;
  background: var(--panel-2);
  border-radius: 7px;
  margin-bottom: 5px;
}
.dispatch-pick-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.dispatch-pick-info b { font-size: 12px; color: var(--ink); }
.dispatch-pick-info span { font-size: 10.5px; color: var(--ink-faint); }
.dispatch-rate { font-family: var(--mono); font-size: 11px; color: var(--amber); flex-shrink: 0; }
.dispatch-trips { margin-top: 10px; }
.dispatch-trip-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  padding: 7px 9px;
  background: var(--panel-2);
  border-left: 2px solid var(--warn);
  border-radius: 0 7px 7px 0;
  margin-bottom: 5px;
}
.dispatch-trip-info { display: flex; flex-direction: column; gap: 1px; }
.dispatch-trip-info b { font-size: 12px; color: var(--ink); }
.dispatch-trip-info span { font-size: 10.5px; color: var(--ink-faint); }
.terroir-inv {
  margin-top: 10px;
  padding: 8px 9px;
  background: var(--panel-2);
  border-radius: 7px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 11.5px;
}
.terroir-line { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.terroir-k { color: var(--ink-faint); font-size: 10.5px; min-width: 30px; }
.terroir-empty { color: var(--ink-faint); font-size: 11px; }
.terroir-chip {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  padding: 2px 7px;
  background: var(--panel-3);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--ink-dim);
  font-size: 11px;
}
.terroir-chip b { font-family: var(--mono); color: var(--amber); font-weight: 600; }
.staff-row .staff-role.away { color: var(--warn); }
.staff-item.away .staff-row { background: var(--panel-3); }
.staff-trip-note {
  margin-top: 8px;
  padding: 7px 9px;
  background: var(--panel);
  border-left: 2px solid var(--warn);
  border-radius: 0 6px 6px 0;
  font-size: 11px;
  color: var(--ink-dim);
  line-height: 1.6;
}

/* ── 销售渠道 ─────────────────────────────────── */
.channel-card { border-left: 2px solid var(--amber-soft); }
.channel-list { display: flex; flex-direction: column; gap: 6px; }
.channel-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  padding: 9px 10px;
  background: var(--panel-2);
  border-left: 2px solid transparent;
  border-radius: 7px;
}
.channel-row.active { border-left-color: var(--good); background: var(--panel-3); }
.channel-row.locked { opacity: .65; }
.channel-info { flex: 1; min-width: 0; }
.channel-head {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: baseline;
  font-size: 12.5px;
}
.channel-head b { font-weight: 600; }
.channel-current {
  font-size: 9.5px;
  color: var(--good);
  border: 1px solid var(--good);
  border-radius: 3px;
  padding: 0 3px;
}
.channel-lock { font-size: 9.5px; color: var(--ink-faint); }
.channel-meta {
  margin-top: 2px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-dim);
  line-height: 1.5;
}
.channel-desc {
  margin-top: 2px;
  font-size: 10.5px;
  color: var(--ink-faint);
  line-height: 1.5;
}
.channel-row .btn-sm { min-width: 64px; flex-shrink: 0; }
.channel-row .btn-sm:not(:disabled) { color: var(--amber); border-color: var(--amber-soft); }
.channel-row .btn-sm:disabled { opacity: .45; }
.receivable {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: 8px;
  padding: 8px 10px;
  background: rgba(215, 162, 74, 0.08);
  border-left: 2px solid var(--amber-soft);
  border-radius: 0 7px 7px 0;
  font-size: 11.5px;
  color: var(--ink-dim);
}
.receivable b { color: var(--amber); }
.receivable span { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }

/* ── 酒厂升级 ─────────────────────────────────── */
.upgrade-list { display: flex; flex-direction: column; gap: 6px; }
.upgrade-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  padding: 8px 10px;
  background: var(--panel-2);
  border-radius: 7px;
}
.upgrade-info { flex: 1; min-width: 0; }
.upgrade-head {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: baseline;
  font-size: 12.5px;
}
.upgrade-head b { font-weight: 600; }
.upgrade-head span { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
.upgrade-desc {
  margin-top: 2px;
  font-size: 11px;
  color: var(--ink-dim);
  line-height: 1.5;
}
.upgrade-effect {
  margin-top: 2px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--good);
}
.upgrade-row .btn-sm { min-width: 72px; flex-shrink: 0; }
.upgrade-row .btn-sm:not(:disabled) { color: var(--amber); border-color: var(--amber-soft); }
.upgrade-row .btn-sm:disabled { opacity: .45; }

/* ── 游戏内更新日志 ───────────────────────────── */
.changelog {
  margin: 8px 0 20px;
  font-size: 11px;
  color: var(--ink-faint);
}
.changelog summary {
  cursor: pointer;
  text-align: center;
  color: var(--amber);
  list-style: none;
}
.changelog summary::-webkit-details-marker { display: none; }
.changelog summary::before { content: '▸ '; }
.changelog[open] summary::before { content: '▾ '; }
.changelog-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}
.changelog-entry {
  padding: 8px 10px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 7px;
}
.changelog-head {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  font-size: 11px;
}
.changelog-head b { color: var(--amber); font-size: 12px; }
.changelog-head span { color: var(--ink-faint); }
.changelog-entry ul { margin: 4px 0 0; padding-left: 16px; line-height: 1.6; }
.changelog-entry li { font-size: 10.5px; color: var(--ink-dim); }

/* ── 赛事与奖杯 ───────────────────────────────── */
.req-ok { color: var(--good); }
.req-bad { color: var(--bad); }

.comp-card { border-left: 2px solid var(--amber); }
.comp-meta {
  font-size: 11px;
  color: var(--ink-dim);
  line-height: 1.65;
}
.comp-picks {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 8px;
}
.comp-pick {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: baseline;
  width: 100%;
  min-height: 42px;
  padding: 8px 10px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 7px;
  color: var(--ink);
  text-align: left;
  font: inherit;
  cursor: pointer;
}
.comp-pick:hover:not(:disabled) { border-color: var(--amber-soft); }
.comp-pick:disabled { opacity: .55; cursor: not-allowed; }
.comp-pick-name { font-size: 13px; font-weight: 600; }
.comp-pick-name em {
  font-style: normal;
  font-size: 9.5px;
  color: var(--amber);
  border: 1px solid var(--amber-soft);
  border-radius: 3px;
  padding: 0 3px;
  margin-left: 4px;
  vertical-align: 1px;
}
.comp-pick-meta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
.comp-hint { margin-top: 6px; font-size: 11px; color: var(--warn); }
.comp-entered {
  margin-top: 8px;
  padding: 8px 10px;
  background: var(--panel-2);
  border-left: 2px solid var(--good);
  border-radius: 0 7px 7px 0;
  font-size: 12px;
  color: var(--ink);
}
.comp-result { border-left: 2px solid var(--line); }
.comp-result.gold { border-left-color: var(--amber); }
.comp-result.silver { border-left-color: var(--ink-dim); }
.comp-result.bronze { border-left-color: var(--bad-soft); }
.comp-result-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: .08em;
}
.comp-result-main { font-size: 22px; margin: 6px 0 2px; }
.comp-result-main b { font-size: 15px; color: var(--amber); margin-left: 4px; }
.comp-result-line { font-size: 11.5px; color: var(--ink-dim); line-height: 1.6; }

.achievement-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
}
.achievement {
  padding: 7px 8px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  opacity: .5;
}
.achievement.on { opacity: 1; border-left: 2px solid var(--good); }
.achievement b { display: block; font-size: 11.5px; color: var(--ink); }
.achievement span { display: block; margin-top: 2px; font-size: 10px; color: var(--ink-faint); line-height: 1.45; }
.achievement em { display: block; margin-top: 2px; font-style: normal; font-size: 9.5px; color: var(--amber); }

.award-list { display: flex; flex-direction: column; gap: 4px; }
.award-row {
  display: grid;
  grid-template-columns: 24px 1fr 1.2fr 40px;
  gap: 6px;
  align-items: baseline;
  padding: 6px 8px;
  background: var(--panel-2);
  border-radius: 6px;
  font-size: 11.5px;
  color: var(--ink-dim);
}
.award-medal { font-size: 14px; }
.award-name { color: var(--ink); font-weight: 600; }
.award-meta { color: var(--ink-faint); font-family: var(--mono); font-size: 10.5px; }
.award-month { color: var(--ink-faint); text-align: right; font-family: var(--mono); font-size: 10px; }
.ending-legacy { margin-bottom: 12px; font-size: 11.5px; line-height: 1.6; color: var(--amber); }
.ending-continue { width: 100%; margin-top: 8px; }

/* ── 发酵罐 ───────────────────────────────────── */
.tank-list { display: flex; flex-direction: column; gap: 1px; }
.tank-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  padding: 8px 10px;
  background: var(--panel-2);
  border-left: 2px solid var(--line);
  font-size: 13px;
}
.tank-row.brewing { border-left-color: var(--amber); }
.tank-row.contract { border-left-color: var(--warn); }
.tank-row .tank-name { font-weight: 600; color: var(--ink); }
.tank-row .tank-status { font-size: 11.5px; color: var(--ink-faint); font-family: var(--mono); }
.tank-row.empty-tank .tank-status { color: var(--ink-faint); }

/* 罐体等级标签：升过级的罐必须一眼看出来，否则「总容量」对不上会困惑 */
.tank-row { flex-wrap: wrap; }
.tank-row .tier-tag {
  font-size: 11px;
  font-family: var(--mono);
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--panel-3);
  color: var(--amber);
  border: 1px solid var(--amber-soft);
  white-space: nowrap;
}
.tank-row .tier-tag.plain {
  color: var(--ink-faint);
  border-color: var(--line);
}
.tank-row .tier-btn {
  min-height: 30px;
  padding: 2px 9px;
  font-size: 11.5px;
  margin-left: auto;
  flex-shrink: 0;
}

/* 超频档位选择 */
.oc-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.oc-label { font-size: 12px; color: var(--ink-faint); flex-shrink: 0; }
.oc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.oc-chip {
  min-height: 32px;
  padding: 3px 10px;
  font-size: 12px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--ink-faint);
  font-family: inherit;
  cursor: pointer;
}
.oc-chip em {
  font-style: normal;
  margin-left: 4px;
  font-size: 11px;
  color: var(--bad);
}
.oc-chip.on {
  color: var(--amber);
  border-color: var(--amber-soft);
  background: var(--panel-3);
}
.oc-chip:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── 库存 ─────────────────────────────────────── */
.inv-list { display: flex; flex-direction: column; gap: 1px; }
.inv-row {
  display: flex;
  justify-content: space-between;
  padding: 7px 10px;
  background: var(--panel-2);
  font-size: 13px;
}
.inv-row .inv-meta { font-size: 11.5px; color: var(--ink-faint); font-family: var(--mono); }
.inv-row.warn .inv-meta { color: var(--warn); }
.inv-row.bad .inv-meta { color: var(--bad); }
/* 陈放中：锁定状态的酒不参与本月销售，用铜色左边框区分开 */
.inv-row.aging { border-left: 3px solid var(--amber); }
.inv-row.aging .inv-meta { color: var(--amber); }
.inv-row.good .inv-meta { color: var(--good); }

/* ── 员工 ─────────────────────────────────────── */
.staff-list { display: flex; flex-direction: column; gap: 4px; }
.staff-item {
  border-radius: 8px;
  overflow: hidden;
  border-left: 2px solid transparent;
}
.staff-item.open { border-left-color: var(--amber); }
.staff-row {
  display: grid;
  grid-template-columns: 1.15fr 0.72fr 0.95fr 0.5fr 0.5fr;
  gap: 6px;
  align-items: baseline;
  padding: 8px 10px;
  background: var(--panel-2);
  font-size: 12px;
  cursor: pointer;
}
.staff-row:hover { background: var(--panel-3); }
.staff-row .staff-name { font-weight: 600; font-size: 13px; }
.staff-row .staff-role { color: var(--ink-dim); }
.staff-row .staff-skill { font-family: var(--mono); color: var(--ink); text-align: right; font-size: 11.5px; }
.staff-row .staff-skill.drag { color: var(--warn); }
.staff-row .staff-mood { font-family: var(--mono); color: var(--ink-faint); font-size: 11.5px; text-align: right; }
.staff-row .staff-mood.bad { color: var(--bad); }
.staff-lv {
  font-style: normal;
  font-size: 9.5px;
  font-weight: 500;
  color: var(--amber);
  border: 1px solid var(--amber-soft);
  border-radius: 3px;
  padding: 0 4px;
  margin-left: 5px;
  vertical-align: 1px;
  white-space: nowrap;
}
.staff-exp {
  grid-column: 1 / -1;
  display: block;
  height: 3px;
  margin-top: 3px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.staff-exp > i {
  display: block;
  height: 100%;
  background: var(--good);
  border-radius: 2px;
  transition: width 0.25s ease;
}
.staff-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  margin-top: 9px;
  font-size: 10.5px;
  color: var(--ink-faint);
}
.staff-detail {
  padding: 11px 12px 12px;
  background: var(--bg-deep);
  border-top: 1px solid var(--line);
}
.staff-detail-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: baseline;
  margin-bottom: 9px;
}
.staff-detail-level { color: var(--amber); font-weight: 600; font-size: 12.5px; }
.staff-detail-next { color: var(--ink-faint); font-size: 10.5px; text-align: right; }
.staff-stat-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
}
.staff-stat {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 8px;
}
.staff-stat .ss-k { display: block; font-size: 10px; color: var(--ink-faint); letter-spacing: 0.04em; }
.staff-stat .ss-v { display: block; font-family: var(--mono); font-size: 15px; color: var(--ink); margin: 1px 0 2px; }
.staff-stat .ss-h { display: block; font-size: 10px; color: var(--ink-faint); line-height: 1.5; }
.staff-role-desc {
  margin-top: 8px;
  font-size: 11.5px;
  color: var(--ink-dim);
  line-height: 1.65;
}
.staff-actions {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 9px;
  flex-wrap: wrap;
}
.staff-train-hint { font-size: 10.5px; color: var(--ink-faint); }

/* ── 配方（可展开） ─────────────────────────── */
.recipe-list { display: flex; flex-direction: column; gap: 6px; }

.recipe-card {
  background: var(--panel-2);
  border-left: 2px solid var(--line);
  border-radius: 0 8px 8px 0;
  overflow: hidden;
}
.recipe-card.good { border-left-color: var(--good); }
.recipe-card.bad { border-left-color: var(--bad); }
.recipe-card.open { background: var(--panel-3); }

.recipe-head {
  display: grid;
  grid-template-columns: 1.4fr 0.45fr 1.9fr 0.25fr;
  gap: 7px;
  align-items: baseline;
  width: 100%;
  padding: 9px 11px;
  background: transparent;
  border: none;
  border-radius: 0;
  color: var(--ink);
  text-align: left;
  font-weight: 500;
}
.recipe-head:hover { background: rgba(215, 162, 74, 0.05); }
.recipe-head .recipe-name { font-size: 13.5px; }
.recipe-head .recipe-name .flag {
  font-style: normal;
  font-size: 9.5px;
  color: var(--amber);
  border: 1px solid var(--amber-soft);
  border-radius: 3px;
  padding: 0 3px;
  margin-left: 4px;
  vertical-align: 1px;
}
.recipe-head .recipe-score {
  font-family: var(--mono);
  font-weight: 600;
  color: var(--amber);
  font-size: 14px;
}
.recipe-head .recipe-meta {
  font-size: 10.5px;
  color: var(--ink-faint);
  font-family: var(--mono);
}
.recipe-head .recipe-caret { color: var(--ink-faint); font-size: 10px; text-align: right; }

/* 发酵周期 + 保质期（v0.21）：放在卡片标题下方，不挤占那行的四列网格 */
.recipe-cycle-row { padding: 0 11px 8px; margin-top: -4px; }
.recipe-cycle-row .cycle {
  font-style: normal;
  font-size: 10.5px;
  font-family: var(--mono);
  color: var(--ink-faint);
  background: rgba(127, 127, 127, 0.1);
  border-radius: 4px;
  padding: 1px 6px;
}
/* 慢发酵：用琥珀色提示「这是一个有代价、也有回报的选择」 */
.recipe-cycle-row .cycle.slow { color: var(--amber); background: rgba(215, 162, 74, 0.12); }

.recipe-body {
  padding: 2px 11px 12px;
  border-top: 1px solid var(--line-soft);
  margin-top: 2px;
}
.recipe-sub {
  font-size: 11px;
  color: var(--ink-faint);
  padding: 8px 0 10px;
}
.recipe-dims { margin-bottom: 10px; }

.metric { margin-bottom: 8px; }
.metric-head {
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
  margin-bottom: 3px;
}
.metric-head .n { color: var(--ink-dim); }
.metric-head .s { font-family: var(--mono); color: var(--ink-faint); }
.metric-bar {
  height: 3px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.metric-bar > i {
  display: block;
  height: 100%;
  background: var(--amber);
  border-radius: 2px;
}
.metric-why {
  font-size: 10.5px;
  color: var(--ink-faint);
  line-height: 1.55;
  margin-top: 4px;
  padding-left: 6px;
  border-left: 1px solid var(--line-soft);
}

.recipe-fit { padding-top: 8px; border-top: 1px solid var(--line-soft); }
.fit-row {
  font-size: 11px;
  color: var(--ink-faint);
  line-height: 1.7;
  font-family: var(--mono);
}
.fit-row .fit-k {
  display: inline-block;
  min-width: 34px;
  color: var(--ink-dim);
  font-family: inherit;
}

.recipe-actions {
  display: flex;
  gap: 7px;
  margin-top: 10px;
}
.recipe-actions button { flex: 1; }

/* ── 对手 ─────────────────────────────────── */
.rival-row {
  display: flex;
  justify-content: space-between;
  margin-top: 9px;
  padding-top: 9px;
  border-top: 1px solid var(--line-soft);
  font-size: 12px;
}
.rival-row .rival-name { color: var(--ink-dim); }
.rival-row .rival-share { font-family: var(--mono); color: var(--bad); }
.rival-move {
  font-size: 10.5px;
  color: var(--ink-faint);
  margin-top: 3px;
}

/* ── 结束本月 ─────────────────────────────────── */
.end-card { padding: 12px 14px 10px; }
.end-hint {
  margin-top: 9px;
  font-size: 11.5px;
  color: var(--ink-faint);
  text-align: center;
  line-height: 1.6;
}

/* ── 日志 ─────────────────────────────────────── */
.log-list { display: flex; flex-direction: column; gap: 5px; }
.log-row {
  font-size: 12px;
  color: var(--ink-dim);
  line-height: 1.55;
  padding-left: 9px;
  border-left: 2px solid var(--line);
}
.log-row.good { border-left-color: rgba(132, 181, 106, 0.6); }
.log-row.bad { border-left-color: rgba(207, 106, 74, 0.6); }
.log-row .log-month {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-faint);
  margin-right: 7px;
}

/* ── 结局 ─────────────────────────────────────── */
.ending { text-align: center; padding: 36px 22px; margin-top: 40px; }
.ending-title { font-size: 22px; font-weight: 700; color: var(--amber); margin-bottom: 14px; letter-spacing: 0.06em; }
.ending-desc { font-size: 13.5px; color: var(--ink-dim); line-height: 1.85; margin-bottom: 24px; }

/* ── 移动端 ───────────────────────────────────── */
@media (max-width: 400px) {
  .action-grid { grid-template-columns: 1fr; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .staff-row { grid-template-columns: 1.1fr 0.65fr 0.9fr 0.45fr 0.45fr; gap: 4px; }
  .achievement-grid { grid-template-columns: 1fr; }
  .staff-lv { margin-left: 3px; font-size: 9px; }
  .recipe-row { grid-template-columns: 1.2fr 0.5fr 1.6fr; }
}

.pick-cost.slow { color: var(--warn); }

@media (min-width: 341px) {
  .achievement-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ── 页面导航（tabbar） ─────────────────────────── */
.tabbar {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 2px;
  margin: 0 -16px 12px;
  padding: 5px 12px 6px;
  border-bottom: 1px solid var(--line-soft);
}
.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  padding: 6px 2px 5px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--ink-faint);
  font-size: 11px;
  cursor: pointer;
  transition: color .15s ease, background .15s ease;
}
.tab .tab-icon { font-size: 14px; line-height: 1; opacity: .8; }
.tab .tab-label { letter-spacing: .04em; }
.tab:hover { color: var(--ink-dim); background: var(--panel); }
.tab.on {
  color: var(--amber);
  background: var(--panel-2);
  border-color: var(--amber-soft);
}
.tab.on .tab-icon { opacity: 1; }

/* ── 月度总结 ─────────────────────────────────── */
.report-card { border-left: 2px solid var(--amber); }
.rep-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  margin-bottom: 10px;
}
.rep-cell {
  background: var(--panel-2);
  border-radius: 7px;
  padding: 7px 8px;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.rep-cell-k { font-size: 10px; color: var(--ink-faint); }
.rep-cell b { font-family: var(--mono); font-size: 15px; color: var(--ink); font-weight: 600; }
.rep-cell b.good { color: var(--good); }
.rep-cell b.bad { color: var(--bad); }
.rep-cell-h { font-size: 9.5px; color: var(--ink-faint); line-height: 1.4; }
.rep-section {
  margin: 9px 0 4px;
  font-size: 10px;
  letter-spacing: .12em;
  color: var(--ink-faint);
  text-transform: uppercase;
}
.rep-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 8px;
  padding: 4px 0;
  border-top: 1px solid var(--line-soft);
  font-size: 12px;
}
.rep-row .rep-k { color: var(--ink-dim); }
.rep-row .rep-v { font-family: var(--mono); color: var(--ink); font-weight: 600; text-align: right; }
.rep-row .rep-h { grid-column: 1 / -1; font-size: 10px; color: var(--ink-faint); line-height: 1.45; }
.rep-net {
  margin-top: 10px;
  padding: 9px 10px;
  border-radius: 7px;
  background: var(--panel-2);
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px;
  font-size: 12px;
  color: var(--ink-dim);
}
.rep-net b { font-family: var(--mono); font-size: 18px; }
.rep-net.good b { color: var(--good); }
.rep-net.bad b { color: var(--bad); }
.rep-net span { font-size: 10px; color: var(--ink-faint); width: 100%; }

/* ── 需求拆解 ─────────────────────────────────── */
.demand-card { border-left: 2px solid var(--amber-soft); }
.demand-base,
.demand-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 8px;
  padding: 6px 0;
  border-top: 1px solid var(--line-soft);
  font-size: 12px;
}
.demand-base { border-top: none; }
.demand-k { color: var(--ink-dim); }
.demand-v { font-family: var(--mono); color: var(--ink); font-weight: 600; text-align: right; }
.demand-h { grid-column: 1 / -1; font-size: 10px; color: var(--ink-faint); line-height: 1.5; }
.demand-row.plus .demand-v { color: var(--good); }
.demand-row.minus .demand-v { color: var(--bad); }
.demand-list { margin-top: 4px; }
.demand-foot {
  margin-top: 8px;
  font-size: 11px;
  color: var(--ink-faint);
}

/* ── 生产罐数步进 ─────────────────────────────── */
.produce-stepper {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 10px;
}
.produce-stepper .btn-sm { min-width: 44px; }
.produce-count {
  font-family: var(--mono);
  font-size: 22px;
  color: var(--amber);
  font-weight: 600;
  min-width: 74px;
  text-align: center;
}
.produce-count em { font-style: normal; font-size: 12px; color: var(--ink-faint); }
.produce-summary {
  background: var(--panel-2);
  border-radius: 7px;
  padding: 8px 10px;
  margin-bottom: 9px;
}
.produce-line {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 2px 0;
  font-size: 12px;
}
.produce-line span:first-child { color: var(--ink-faint); min-width: 62px; }
.produce-line b { font-family: var(--mono); color: var(--ink); }
.produce-line .produce-h { font-size: 10px; color: var(--ink-faint); margin-left: auto; }
.produce-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.produce-actions .btn-sm { min-height: 40px; }

/* ── 酒窖：混酿入口 / 风土库存 ─────────────────── */
.blend-entry { border-left: 2px solid var(--amber-soft); }
.blend-entry-body {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.blend-entry-info { flex: 1 1 auto; min-width: 0; }
.blend-entry-body .btn-cta { flex: 0 0 auto; min-height: 40px; }
.blend-entry-line {
  font-size: 12px;
  color: var(--ink-dim);
  line-height: 1.7;
  word-break: break-word;
}
.blend-entry-line b { font-family: var(--mono); color: var(--ink); }

.terroir-card { border-left: 2px solid var(--amber-soft); }
.terroir-list { display: flex; flex-direction: column; gap: 5px; }
.terroir-row {
  background: var(--panel-2);
  border-radius: 7px;
  padding: 7px 9px;
  border-left: 2px solid var(--amber-soft);
}
.terroir-row.empty { opacity: .55; border-left-color: var(--line); }
.terroir-row-main {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 12px;
}
.terroir-row-main b { color: var(--ink); }
.terroir-count { font-family: var(--mono); color: var(--amber); }
.terroir-flavors { font-size: 10.5px; color: var(--ink-faint); }
.terroir-row-hint { font-size: 10px; color: var(--ink-faint); line-height: 1.5; margin-top: 1px; }

/* ── 团队：派遣入口 ───────────────────────────── */
.dispatch-entry { border-left: 2px solid var(--amber-soft); }
.dispatch-entry-body { display: flex; gap: 12px; align-items: flex-start; }
.dispatch-entry-info { flex: 1; min-width: 0; }
.dispatch-entry-body .btn-cta { flex-shrink: 0; min-height: 40px; }
.trip-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.trip-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--panel-3);
  border: 1px solid var(--warn-soft);
  color: var(--warn);
  font-size: 10.5px;
}
.stat-hint.warn { color: var(--warn); }

/* ── 玩法说明 ─────────────────────────────────── */
.guide-card { border-left: 2px solid var(--amber-soft); }
.guide-block {
  border-top: 1px solid var(--line-soft);
  padding: 8px 0;
}
.guide-block:first-of-type { border-top: none; }
.guide-block summary {
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--amber);
  list-style: none;
  padding: 2px 0;
}
.guide-block summary::-webkit-details-marker { display: none; }
.guide-block summary::before { content: '▸ '; color: var(--ink-faint); }
.guide-block[open] summary::before { content: '▾ '; }
.guide-body { padding: 6px 0 2px 14px; font-size: 12px; color: var(--ink-dim); line-height: 1.8; }
.guide-body p { margin: 0 0 7px; }
.guide-body p:last-child { margin-bottom: 0; }
.guide-body b { color: var(--ink); }
.guide-body ul { margin: 0 0 7px; padding-left: 18px; }
.guide-body li { margin-bottom: 3px; }

/* ── 重新开局 ─────────────────────────────────── */
/*
 * 放在档案页最底部：玩家想找它的时候找得到，平时又不会误触。
 * 左侧用危险色而不是琥珀色 —— 别的卡片都是「给你什么」，这张是「拿走什么」。
 */
.restart-card { border-left: 2px solid var(--bad); }
.restart-current {
  margin: 0 0 8px;
  font-size: 12px;
  color: var(--ink-dim);
}
.restart-warn {
  margin: 0 0 12px;
  font-size: 11.5px;
  line-height: 1.8;
  color: var(--ink-faint);
}
.restart-warn b { color: var(--warn); }
/* 二次确认：不用弹窗，直接把这张卡换掉，省得再写一层遮罩 */
.restart-confirm {
  border-top: 1px solid var(--line-soft);
  padding-top: 10px;
}
.restart-confirm-text {
  font-size: 12.5px;
  color: var(--bad);
  margin-bottom: 8px;
}
/*
 * ⚠️ 两个按钮放进 flex 行时，绝不能给 width: 100%
 * （v0.14 的教训：.btn-primary 在 flex 行里会把文字压成宽度 0）。
 * 这里两个都是 btn-sm，保持自然宽度。
 */
.restart-actions {
  display: flex;
  gap: 8px;
}
.restart-actions button { flex: 1; }

.btn-danger {
  background: var(--bad);
  color: #fff;
  font-weight: 600;
  border: none;
}

@media (max-width: 400px) {
  .tab .tab-label { font-size: 10px; }
  .rep-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .blend-entry-body,
  .dispatch-entry-body { flex-direction: column; }
  .blend-entry-body .btn-cta,
  .dispatch-entry-body .btn-cta { width: 100%; }
}

.rep-spend-note {
  font-size: 10.5px;
  color: var(--ink-faint);
  margin: -2px 0 4px;
  line-height: 1.5;
}
.rep-total {
  margin-top: 8px;
  padding-top: 7px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--ink-dim);
  display: flex;
  justify-content: space-between;
}
.rep-total b { font-family: var(--mono); font-size: 14px; color: var(--ink); }

/* 其他页上的赛事入口：一行，不抢版面 */
.comp-teaser {
  display: block;
  width: 100%;
  text-align: left;
  padding: 9px 12px;
  margin-bottom: 12px;
  background: var(--panel-2);
  border: 1px solid var(--amber-soft);
  border-radius: 8px;
  color: var(--amber);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
}
.comp-teaser.done { border-color: var(--line); color: var(--good); }

/* ── 开场流程：封面与玩法说明（v0.18） ─────────────── */
/*
 * 这一屏和游戏内的面板刻意不同：没有顶栏、没有导航、没有现金和月份 ——
 * 进来时还没有「你的酒厂」，显示一堆零只会让人困惑。
 * 视觉上更像一张扉页：大标题 + 一句话 + 一颗按钮。
 */
.entry {
  padding-top: calc(40px + env(safe-area-inset-top));
  padding-bottom: 32px;
}

.entry-hero { margin-bottom: 26px; }
.entry-hero-compact { margin-bottom: 18px; }

.entry-eyebrow {
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--amber-soft);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.entry-title {
  margin: 0 0 14px;
  font-size: 34px;
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--amber);
}
.entry-title-sm { font-size: 24px; letter-spacing: 0.06em; }

.entry-tagline {
  margin: 0;
  font-size: 13.5px;
  line-height: 1.9;
  color: var(--ink-dim);
}
.entry-tagline b { color: var(--ink); }

/* 三条卖点：分行，不并排 —— 手机宽度下并排会挤成一团 */
.entry-points {
  list-style: none;
  margin: 0 0 28px;
  padding: 0;
  border-top: 1px solid var(--line-soft);
}
.entry-points li {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line-soft);
}
.entry-points b { font-size: 13px; color: var(--ink); font-weight: 600; }
.entry-points span { font-size: 12px; color: var(--ink-faint); line-height: 1.7; }

.entry-actions { display: flex; flex-direction: column; gap: 10px; }
/* .btn-primary 自带 width:100%，这里只需要管次级按钮的间距和字重 */
.entry-secondary { text-align: center; font-size: 13.5px; }

/*
 * 「跳过说明」：做成一行文字而不是按钮。
 * 它是有意义的退路，但不该和「开始游戏」抢注意力 ——
 * 第一次玩的人先读说明才是这个流程想引导的行为。
 */
.entry-skip {
  display: inline-block;
  margin-top: 14px;
  padding: 4px 0;
  background: none;
  border: none;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  font-size: 12px;
  font-weight: 400;
  color: var(--ink-faint);
  cursor: pointer;
}
.entry-skip:hover { color: var(--amber); border-bottom-color: var(--amber-soft); }

/* 开场流程里的说明卡：没有卡片内边距压缩，长文要能舒服地读 */
.entry-guide { padding: 6px 14px; margin-bottom: 20px; }
.entry-guide .guide-block { padding: 12px 0; }

      <p>\u4EE3\u4EF7\u5F88\u660E\u663E\uFF1A<b>\u540C\u6837\u4E00\u53EA\u7F50\uFF0C\u4E24\u4E2A\u6708\u624D\u51FA\u4E00\u6279\uFF0C\u4EA7\u80FD\u76F4\u63A5\u51CF\u534A</b>\u3002
      \u4F46\u8FD9\u4E24\u7C7B\u9152\u4E5F\u56E0\u6B64<b>\u66F4\u8010\u653E</b> \u2014\u2014 \u8BE6\u89C1\u4E0B\u9762\u7684\u4FDD\u8D28\u671F\u3002</p>
      <p><b>\u5356\u9152</b>\uFF1A\u51FA\u9152\u540E\u5165\u5E93\uFF0C\u6BCF\u6708\u7ED3\u7B97\u65F6\u6309<b>\u65B0\u9C9C\u5EA6</b>\u5356\u3002\u666E\u901A\u9152\u5F53\u6708 100%\u3001
      1 \u4E2A\u6708 80%\u30012 \u4E2A\u6708 55%\uFF0C\u7B2C 3 \u4E2A\u6708\u5356\u4E0D\u6389\u5C31\u5012\u6389\u3002
      \u6240\u4EE5<b>\u4EA7\u80FD\u4E0D\u662F\u8D8A\u5927\u8D8A\u597D</b>\uFF0C\u917F\u591A\u4E86\u5356\u4E0D\u6389\u5C31\u662F\u5728\u70E7\u94B1\u3002</p>
      <p><b>\u4FDD\u8D28\u671F\u4E0D\u4E00\u6837</b>\uFF1A\u9152\u82B1\u9999\u6C14\u662F\u9000\u5316\u6700\u5FEB\u7684\u6210\u5206\uFF0C\u5E72\u6295 IPA \u51E0\u5468\u5C31\u8D70\u5473\uFF1B
      \u800C\u62C9\u683C\u548C\u9AD8\u6D53\u5EA6\u9152\u7684\u6C27\u5316\u654F\u611F\u6027\u4F4E\u5F97\u591A\u3002\u6240\u4EE5<b>\u6162\u53D1\u9175\u7684\u9152</b>\u8D2C\u503C\u66F4\u6162
      \uFF0890% \u2192 78% \u2192 65%\uFF09\uFF0C\u4FDD\u8D28\u671F\u8FD8\u591A\u4E00\u4E2A\u6708\uFF0C\u5230<b>\u7B2C 4 \u4E2A\u6708</b>\u624D\u5012\u6389\u3002
      \u8FD9\u5C31\u662F\u300C\u6162\u300D\u6362\u6765\u7684\u4E1C\u897F\uFF1A\u4E0D\u662F\u66F4\u9AD8\u7684\u5355\u4EF7\uFF0C\u800C\u662F<b>\u66F4\u957F\u7684\u9500\u552E\u7A97\u53E3</b> \u2014\u2014
      \u94FA\u5168\u56FD\u6E20\u9053\u3001\u6216\u8005\u8FD9\u4E2A\u6708\u9700\u6C42\u4E0D\u591F\u7684\u65F6\u5019\uFF0C\u5B83\u4E0D\u4F1A\u9A6C\u4E0A\u70C2\u5728\u4ED3\u5E93\u91CC\u3002</p>
      <p><b>\u552E\u4EF7</b>\u53D6\u51B3\u4E8E\u8BC4\u5206\uFF0C\u800C\u4E14\u662F 1.5 \u6B21\u5E42\uFF1A45 \u5206\u6BD4 40 \u5206\u8D35\u5F97\u591A\u3002
      \u8FD9\u5C31\u662F\u300C\u917F\u597D\u9152\u300D\u6700\u76F4\u63A5\u7684\u56DE\u62A5\u3002</p>
      <p><b>\u9648\u653E</b>\uFF1A\u300C\u9152\u7A96\u300D\u9875\u53EF\u4EE5\u628A\u4E00\u6B3E\u65B0\u9C9C\u9152\u9501\u8D77\u6765\uFF0C\u62BC\u4E09\u4E2A\u6708\u3002
      \u671F\u95F4\u5B83\u4E0D\u8FDB\u9500\u552E\u6C60\u3001\u4E0D\u63A5\u5408\u540C\uFF0C\u4E2D\u95F4\u7167\u6536\u51B7\u5E93\u8D39\uFF0C\u4E00\u5206\u94B1\u6536\u4E0D\u56DE\u6765\uFF1B
      \u4E09\u4E2A\u6708\u540E\u51FA\u5E93\uFF0C\u6309\u9648\u653E\u540E\u7684\u4EF7\u683C\u5356\u4E00\u6B21\u3002
      <b>\u8010\u9648\u7684\u9152\u624D\u4F1A\u5347\u503C</b>\uFF08\u9AD8\u9152\u7CBE\u5EA6 \u22658%\u3001\u6DF1\u8272 / \u4E16\u6D9B\u6CE2\u7279\u3001\u5170\u6BD4\u514B\uFF09\uFF0C
      \u5176\u4ED6\u9152\u9501\u8FDB\u53BB\u53EA\u4F1A\u8D2C\u503C \u2014\u2014 \u9501\u9519\u9152\u5C31\u662F\u7EAF\u4E8F\u3002\u8FD9\u662F\u300C\u8FD9\u6279\u9152\u73B0\u5728\u5356\u8FD8\u662F\u62BC\u4E00\u624B\u300D\u7684\u53D6\u820D\u3002</p>
    `},{title:"\u9700\u6C42\u4ECE\u54EA\u6765",body:`
      <p>\u300C\u5E02\u573A\u300D\u9875\u6709\u5B8C\u6574\u7684\u7B97\u5F0F\u3002\u7B80\u5355\u8BF4\uFF1A<b>\u57FA\u7840\u76D8 \xD7 \u4E00\u4E32\u4E58\u6570 + \u4E8B\u4EF6\u8BA2\u5355 + \u5B63\u8282\u8D8B\u52BF</b>\u3002</p>
      <ul>
        <li><b>\u57FA\u7840\u76D8</b>\u968F\u9636\u6BB5\u53D8\u5927\uFF08\u9636\u6BB5 1 \u662F 1100L\uFF0C\u9636\u6BB5 6 \u662F 5200L\uFF09</li>
        <li><b>\u58F0\u671B</b>\u662F\u6700\u4E3B\u8981\u7684\u4E58\u6570\uFF1A\u58F0\u671B 0 \u65F6\u53EA\u6709 0.7 \u500D\uFF0C\u58F0\u671B 100 \u65F6 1.6 \u500D</li>
        <li><b>\u9500\u552E</b>\u5458\u5DE5\u7684\u6280\u80FD\u4F1A\u52A0\u9700\u6C42\uFF1B<b>\u5BF9\u624B</b>\u4F1A\u62A2\u8D70\u4E00\u90E8\u5206</li>
        <li><b>\u62DB\u724C\u9152</b> +8%\u3001<b>\u5956\u676F</b>\u6301\u7EED\u52A0\u6301\u3001<b>\u6E20\u9053\u5347\u7EA7</b>\u6BCF\u7EA7 +3%</li>
        <li><b>\u6E20\u9053</b>\u51B3\u5B9A\u9700\u6C42\u500D\u7387\u3001\u552E\u4EF7\u500D\u7387\u548C\u8D26\u671F</li>
      </ul>
      <p>\u60F3\u63D0\u9AD8\u9700\u6C42\uFF0C\u6700\u6709\u6548\u7684\u662F<b>\u5347\u58F0\u671B</b>\uFF08\u9760\u5356\u597D\u9152\u548C\u505A\u8425\u9500\uFF09\u3002</p>
      <p><b>\u4F46\u9700\u6C42\u4E0D\u662F\u5168\u90E8\u80FD\u5356\u6389\u7684</b>\uFF1A\u6BCF\u6B3E\u9152\u6700\u591A\u5403\u6389 70%\uFF08\u89C1\u300C\u6DF7\u917F\u4E0E\u98CE\u571F\u300D\uFF09\u3002
      \u6240\u4EE5\u300C\u63D0\u9AD8\u9700\u6C42\u300D\u548C\u300C\u591A\u94FA\u51E0\u6B3E\u9152\u300D\u662F\u4E24\u4EF6\u90FD\u8981\u505A\u7684\u4E8B \u2014\u2014
      \u4E00\u6B3E\u9152\u518D\u53D7\u6B22\u8FCE\uFF0C\u4E00\u4E2A\u6708\u4E5F\u5C31\u90A3\u4E48\u591A\u8D27\u67B6\u3002</p>
    `},{title:"\u5458\u5DE5\u600E\u4E48\u517B",body:`
      <p>\u4E09\u79CD\u5C97\u4F4D\uFF1A<b>\u917F\u9152\u5E08</b>\u51B3\u5B9A\u7814\u53D1\u4E0E\u6DF7\u917F\u7684\u8D28\u91CF\uFF0C<b>\u5DE5\u4EBA</b>\u63D0\u9AD8\u51FA\u9152\u7387\uFF0C<b>\u9500\u552E</b>\u63D0\u9AD8\u9700\u6C42\u3002</p>
      <p>\u5458\u5DE5\u6709<b>\u80FD\u529B</b>\uFF08\u957F\u671F\uFF0C\u9760\u7ECF\u9A8C\u6DA8\uFF09\u3001<b>\u7CBE\u529B</b>\uFF08\u5E72\u6D3B\u6389\uFF0C\u4F11\u606F\u56DE\uFF09\u3001<b>\u58EB\u6C14</b>\uFF08\u4E8F\u94B1\u6389\uFF0C
      \u4F4E\u4E8E 30 \u4F1A\u8F9E\u804C\uFF09\u3002\u6709\u6548\u80FD\u529B = \u80FD\u529B \xD7 \u7CBE\u529B\u4E0E\u58EB\u6C14\u7684\u6298\u6263\u3002</p>
      <p><b>\u57F9\u8BAD</b>\u82B1 1 \u884C\u52A8\u70B9 + \u73B0\u91D1\u6362\u7ECF\u9A8C\uFF1B<b>\u751F\u4EA7</b>\u4E5F\u4F1A\u8BA9\u917F\u9152\u5E08\u548C\u5DE5\u4EBA\u6512\u7ECF\u9A8C\u3002
      \u966A\u4E00\u4E2A\u917F\u9152\u5E08\u4ECE 55 \u71AC\u5230 75 \u662F\u4E00\u6761\u771F\u5B9E\u7684\u8DEF\u3002</p>
    `},{title:"\u6A61\u6728\u6876",body:`
      <p>\u6876\u5728<b>\u300C\u9152\u7A96\u300D\u9875</b>\uFF0C\u548C\u5E93\u5B58\u3001\u9648\u653E\u5728\u4E00\u8D77 \u2014\u2014 \u5B83\u4EEC\u5904\u7406\u7684\u662F\u540C\u4E00\u4EF6\u4E8B\uFF1A\u6210\u54C1\u600E\u4E48\u653E\u3002</p>
      <p>\u6876\u662F<b>\u5B9E\u4F53</b>\uFF1A\u4E70\u4E00\u53EA\u662F\u957F\u671F\u6295\u8D44\uFF0C\u80FD\u53CD\u590D\u7528\uFF08\u6B21\u6570\u6709\u9650\uFF0C\u6728\u6876\u4F1A\u8870\u51CF\uFF09\u3002</p>
      <p>\u6876\u578B\u548C\u98CE\u683C\u6709<b>\u9002\u914D\u5EA6</b>\uFF1A\u5F88\u642D\u7684\u6876\u51FA\u6876\u65F6\u6EA2\u4EF7\u9AD8\uFF0C\u4E70\u9519\u6876\u53CD\u800C\u6BD4\u4E0D\u9648\u8FD8\u5DEE\u3002
      \u5165\u6876\u8981 1 \u884C\u52A8\u70B9\uFF0C\u4E00\u6B21\u586B\u6EE1\u540C\u578B\u7684\u6240\u6709\u7A7A\u6876\u3002</p>
      <p>\u6876\u9648\u7684\u4EF7\u503C\u4E0D\u53EA\u6EA2\u4EF7 \u2014\u2014 \u5B83\u540C\u65F6\u662F<b>\u5EF6\u957F\u4FDD\u8D28\u671F</b>\u7684\u529E\u6CD5\u3002</p>
    `},{title:"\u6DF7\u917F\u4E0E\u98CE\u571F",body:`
      <p><b>\u6BCF\u6B3E\u9152\u6700\u591A\u53EA\u80FD\u5403\u6389\u672C\u6708\u9700\u6C42\u7684 70%</b>\u3002\u5269\u4E0B\u7684 30% \u53EA\u80FD\u9760\u522B\u7684\u9152\u53BB\u63A5 \u2014\u2014
      \u6240\u4EE5\u4F60\u917F\u5F97\u518D\u591A\uFF0C\u4E00\u6B3E\u9152\u4E5F\u5356\u4E0D\u5B8C\u6574\u4E2A\u6708\u3002\u8D85\u51FA\u4E0A\u9650\u7684\u90A3\u90E8\u5206\u4F1A\u5728\u5E93\u5B58\u91CC\u79EF\u538B\uFF0C
      \u4E0B\u4E2A\u6708\u6253\u6298\u3001\u7B2C\u4E09\u4E2A\u6708\u5012\u6389\u3002</p>
      <p><b>\u6DF7\u917F\u9152\u4E0D\u53D7\u8FD9\u6761\u9650\u5236\u3002</b>\u5B83\u662F\u72EC\u7ACB\u9152\u6B3E\uFF0C\u80FD\u63A5\u4F4F\u8FD9\u90E8\u5206\u6EA2\u51FA \u2014\u2014
      \u8FD9\u5C31\u662F\u6DF7\u917F\u7684\u4F4D\u7F6E\uFF1A<b>\u628A\u8FD9\u4E2A\u6708\u6CE8\u5B9A\u5356\u4E0D\u6389\u7684\u9152\uFF0C\u53D8\u6210\u5356\u5F97\u6389\u7684\u9152</b>\u3002
      \u4E0D\u662F\u300C\u6DF7\u51FA\u66F4\u9AD8\u5206\u300D\uFF08\u6DF7\u917F\u5206\u6570\u662F\u57FA\u9152\u52A0\u6743\uFF0C\u4E0D\u4F1A\u9AD8\u8FC7\u6700\u597D\u7684\u90A3\u6B3E\uFF09\uFF0C
      \u800C\u662F\u300C\u628A\u6EDE\u9500\u6362\u6210\u6D41\u52A8\u300D\u3002</p>
      <p>\u628A 2\u20134 \u6B3E\u5E93\u5B58\u9152\u6309\u6BD4\u4F8B\u8C03\u5408\u6210\u65B0\u4EA7\u54C1\uFF0C\u6BCF\u6708\u6700\u591A 2 \u6B21\uFF0C\u6D88\u8017 1 \u884C\u52A8\u70B9\u3002
      \u6279\u91CF\u53EF\u4EE5\u8C03 <b>40\u2013600L</b> \u2014\u2014 \u65E9\u671F\u62FF\u4E24\u52FA\u8C03\u4E00\u676F\u4E5F\u6210\u7ACB\uFF0C\u540E\u671F\u53EF\u4EE5\u4E00\u6B21\u5403\u6389\u6574\u6761\u6EDE\u9500\u5C3E\u5DF4\u3002
      \u5206\u6570\u6309\u914D\u6BD4\u52A0\u6743\uFF0C\u78B0\u5DE7\u642D\u5F97\u597D\u4F1A\u6709\u534F\u540C\u52A0\u6210\uFF08\u6BD4\u5982\u9178 \xD7 \u70D8\u70E4\u9AA8\u67B6\uFF09\u3002</p>
      <p><b>\u98CE\u571F\u6750\u6599</b>\u662F\u6DF7\u917F\u7684\u52A0\u5206\u9879\uFF1A<b>\u91CE\u83CC\u83CC\u79CD</b>\u4E3B\u8981\u63D0\u5206\uFF0C<b>\u5730\u65B9\u7279\u4EA7</b>\u4E3B\u8981\u63D0\u6EA2\u4EF7\u3002
      \u4E24\u8005\u90FD\u6309<b>\u4E3B\u5BFC\u98CE\u683C\u7684\u9002\u914D\u5EA6</b>\u6253\u6298 \u2014\u2014 \u628A\u5E03\u96F7\u7279\u4E22\u8FDB\u76AE\u5C14\u68EE\u53EA\u80FD\u53D1\u6325 30%\u3002
      \u7528\u91CF\u968F\u6279\u91CF\u8D70\uFF1A\u6DF7 600L \u8981\u7528 6 \u4EFD\uFF0C\u4E0D\u80FD\u62FF 1 \u4EFD\u767D\u5403\u3002</p>
      <p>\u8FD9\u4E9B\u6750\u6599\u8981\u6D3E\u4EBA\u53BB<b>\u79E6\u5CAD\u3001\u5FBD\u5DDE\u3001\u65B0\u7586\u3001\u4E91\u5357\u3001\u6CBF\u6D77</b>\u63A2\u7D22\u624D\u6709\uFF0C\u662F\u6D88\u8017\u54C1\u3002</p>
    `},{title:"\u6D3E\u9063\u63A2\u7D22",body:`
      <p>\u6D3E\u4E00\u540D\u5458\u5DE5\u53BB\u5916\u5730\uFF0C1\u20132 \u4E2A\u6708\u540E\u56DE\u6765\uFF0C\u5E26\u56DE\u83CC\u79CD\u6216\u7279\u4EA7 \u2014\u2014 \u8FD9\u662F\u6DF7\u917F\u98CE\u571F\u6750\u6599\u7684\u552F\u4E00\u6765\u6E90\u3002
      <b>\u4E0D\u6DF7\u917F\u7684\u8BDD\uFF0C\u6D3E\u9063\u5C31\u662F\u7EAF\u4E8F</b>\uFF0C\u6240\u4EE5\u5B83\u548C\u6DF7\u917F\u662F\u7ED1\u5728\u4E00\u8D77\u7684\u4E00\u6761\u7EBF\u3002</p>
      <p><b>\u4EE3\u4EF7\u662F\u771F\u5B9E\u7684</b>\uFF1A1 \u884C\u52A8\u70B9 + \u8FD9\u4EBA\u5728\u5916\u671F\u95F4<b>\u4E0D\u518D\u63D0\u4F9B\u884C\u52A8\u70B9</b> + \u7167\u53D1\u5DE5\u8D44 + \u5DEE\u65C5\u8D39\u3002
      \u7B97\u4E0B\u6765\u6D3E\u4E00\u4E2A\u4EBA\u5B9E\u9645\u635F\u5931\u7EA6 2 \u70B9\u884C\u52A8\u529B\u3002</p>
      <p>\u5916\u6D3E\u671F\u95F4\u8FD9\u4EBA\u4E0D\u505A\u672C\u804C\u3001\u4E0D\u6062\u590D\u7CBE\u529B\uFF0C\u4E5F<b>\u4E0D\u4F1A\u5728\u5916\u5730\u8F9E\u804C</b>\u3002
      \u4EFB\u52A1\u53EF\u80FD\u5931\u8D25\uFF0C<b>\u5931\u8D25\u7A7A\u624B\u4F46\u4E0D\u4F24\u4EBA</b>\uFF0C\u8FD8\u4F1A\u5E26\u56DE\u4E00\u70B9\u89C1\u95FB\u3002\u53EF\u4EE5\u63D0\u524D\u53EC\u56DE\uFF0C\u4EE3\u4EF7\u662F\u6210\u529F\u7387\u6253\u516B\u6298\u3002</p>
    `},{title:"\u53D1\u9175\u7F50\uFF1A\u4E70\u3001\u6539\u9020\u3001\u8D85\u9891",body:`
      <p><b>\u7F50\u5B50\u6709\u4E24\u4E2A\u7EF4\u5EA6</b>\uFF1A\u6570\u91CF\uFF08\u6700\u591A 6 \u4E2A\uFF09\u548C<b>\u7F50\u4F53\u7B49\u7EA7</b>\uFF08\u6807\u51C6 / \u52A0\u5927 \xD71.5 / \u5927\u578B \xD72.2 / \u53D1\u9175\u5854 \xD73\uFF09\u3002</p>
